[versions]
agp = "8.10.1"
kotlin = "2.2.21-1.0.0"
compose = "1.10.3"
kuikly = "2.28.0-2.0.21-ohos"
coroutines = "1.10.2-1.0.0"
activity = "1.13.0"
androidxCore = "1.16.0"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
kuikly-core = { module = "com.tencent.kuikly-open:core", version.ref = "kuikly" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
